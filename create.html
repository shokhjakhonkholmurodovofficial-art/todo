<!DOCTYPE html>
<html lang="uz" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi Vazifa | Pro Tasks</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="page-transition">
    <div class="app-container">
        <aside class="sidebar slide-in-left">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i> <span>ProTasks</span>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-inbox"></i> Barcha vazifalar</a>
                <a href="create.html" class="nav-item active"><i class="fa-solid fa-plus"></i> Yangi qo'shish</a>
            </nav>
        </aside>

        <main class="main-content fade-in-up">
            <header class="topbar">
                <h2><i class="fa-solid fa-plus-circle"></i> Yangi Vazifa Yaratish</h2>
                <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Ortga</a>
            </header>

            <section class="form-section">
                <form id="taskForm" class="glass-panel">
                    <div class="form-group">
                        <label>Vazifa nomi</label>
                        <input type="text" id="taskTitle" required placeholder="Masalan: UI dizayn" autocomplete="off">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Muhimlik darajasi</label>
                            <select id="taskPriority">
                                <option value="low">Past</option>
                                <option value="medium" selected>O'rta</option>
                                <option value="high">Yuqori</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tugash muddati</label>
                            <input type="date" id="taskDeadline" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary ripple">
                            <i class="fa-solid fa-save"></i> Vazifani Saqlash
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
